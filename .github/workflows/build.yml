name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Download FaceNet model
        run: |
          mkdir -p ai/src/main/assets/models
          curl -L "https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite" \
            -o ai/src/main/assets/models/mobilefacenet.tflite
          ls -lh ai/src/main/assets/models/mobilefacenet.tflite

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartGalleryAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
